<ion-content class="auth-content">
<app-auth-layout>
<section aria-labelledby="login-title">
      <h1 id="login-title">Connexion</h1>
      <p class="welcome">Ravi de vous revoir !<br />Connectez-vous à votre compte pour continuer.</p>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <div class="field-group">
          <ion-input id="email" type="email" formControlName="email" label="Adresse e-mail" labelPlacement="stacked" fill="outline" mode="md" autocomplete="username" inputmode="email" autocapitalize="off" required errorText="Saisissez une adresse e-mail valide.">
            <ion-icon slot="start" [icon]="icons.mailOutline" aria-hidden="true" />
          </ion-input>
        </div>
        <div class="field-group">
          <ion-input id="password" [type]="passwordVisible() ? 'text' : 'password'" [clearOnEdit]="false" formControlName="password" label="Mot de passe" labelPlacement="stacked" fill="outline" mode="md" autocomplete="current-password" required errorText="Saisissez votre mot de passe.">
            <ion-icon slot="start" [icon]="icons.lockClosedOutline" aria-hidden="true" />
            <ion-button slot="end" fill="clear" class="visibility" type="button" (click)="passwordVisible.set(!passwordVisible())" [attr.aria-label]="passwordVisible() ? 'Masquer le mot de passe' : 'Afficher le mot de passe'" [attr.aria-pressed]="passwordVisible()"><ion-icon slot="icon-only" [icon]="passwordVisible() ? icons.eyeOffOutline : icons.eyeOutline" aria-hidden="true" /></ion-button>
          </ion-input>
        </div>
        <div class="form-options">
          <ion-checkbox class="remember" formControlName="rememberMe" labelPlacement="end" justify="start" title="La connexion persistante n’est pas encore disponible">Se souvenir de moi</ion-checkbox>
          <ion-button type="button" fill="clear" class="text-action forgot" (click)="showUnavailable('La récupération du mot de passe')">Mot de passe oublié ?</ion-button>
        </div>
        <ion-button class="primary sign-in" expand="block" type="submit" [disabled]="busy()" [attr.aria-busy]="busy()">@if (busy()) { <ion-spinner slot="start" name="crescent" aria-hidden="true" /> }{{ busy() ? 'Connexion…' : 'Se connecter' }}<ion-icon slot="end" [icon]="icons.arrowForwardOutline" aria-hidden="true" /></ion-button>
      </form>
      <div class="divider"><span>ou continuer avec</span></div>
      <div class="social-buttons">
        <ion-button class="secondary" type="button" aria-label="Se connecter avec Google" (click)="showUnavailable('La connexion avec Google')">
          <svg slot="start" viewBox="0 0 48 48" aria-hidden="true"><path fill="#4285f4" d="M43.6 24.5c0-1.5-.1-3-.4-4.5H24v8.5h11a9.4 9.4 0 0 1-4.1 6.2v5.2h6.7c3.9-3.6 6-8.8 6-15.4" /><path fill="#34a853" d="M24 44c5.4 0 10-1.8 13.4-4.9l-6.7-5.2c-1.8 1.2-4.1 1.9-6.7 1.9-5.2 0-9.6-3.5-11.2-8.2H6v5.4A20 20 0 0 0 24 44" /><path fill="#fbbc05" d="M12.8 27.6a12 12 0 0 1 0-7.2V15H6a20 20 0 0 0 0 18z" /><path fill="#ea4335" d="M24 12.2c3 0 5.6 1 7.7 3l5.8-5.8A19.3 19.3 0 0 0 24 4 20 20 0 0 0 6 15l6.8 5.4A11.9 11.9 0 0 1 24 12.2" /></svg>Google
        </ion-button>
        <ion-button class="secondary" type="button" aria-label="Se connecter avec Apple" (click)="showUnavailable('La connexion avec Apple')"><ion-icon slot="start" [icon]="icons.logoApple" aria-hidden="true" />Apple</ion-button>
      </div>
      <p class="register">Vous n’avez pas de compte ? <a class="text-action" routerLink="/auth/register">S’inscrire</a></p>
      <p class="feedback" role="status">{{ feedback() }}</p>
</section>
</app-auth-layout>
</ion-content>
