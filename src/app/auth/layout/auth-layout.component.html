<main class="auth-screen" [class.registration]="variant() === 'register'">
  <svg class="clip-definitions" aria-hidden="true" focusable="false">
    <defs><clipPath [attr.id]="curveId" clipPathUnits="objectBoundingBox"><path d="M0,0 H.76 C.88,.17 .86,.30 .82,.45 C.75,.64 .79,.70 .88,.82 C.96,.92 .96,.97 .945,1 H0 Z" /></clipPath></defs>
  </svg>
  <div class="hero-edge" aria-hidden="true"></div>
  <div class="hero-photo" aria-hidden="true"></div>

<div class="hero-content">
  <header class="brand">
    <img src="assets/images/logo/pawrescue-logo.png" alt="" width="96" height="96" />
    <div><p class="brand-name">PawRescue <span>AI</span></p><p class="brand-description">Plateforme intelligente de secours,<br />de suivi et d’adoption des animaux</p></div>
  </header>
  <aside class="hero-copy" aria-label="Notre mission">
    <h2>Pour un monde<br />meilleur pour<br />tous les animaux.</h2>
    <div class="mission-line"></div>
    <ul class="features">
      <li><span class="feature-icon report"><ion-icon [icon]="icons.megaphone" aria-hidden="true" /></span><strong>Signaler</strong><small>un animal</small></li>
      <li><span class="feature-icon rescue"><ion-icon [icon]="icons.heart" aria-hidden="true" /></span><strong>Secourir</strong><small>en cas d’urgence</small></li>
      <li><span class="feature-icon adopt"><ion-icon [icon]="icons.home" aria-hidden="true" /></span><strong>Adopter</strong><small>et offrir un foyer</small></li>
      <li><span class="feature-icon support"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M18 15s-8-5-8-9a4 4 0 0 1 8-1 4 4 0 0 1 8 1c0 4-8 9-8 9ZM3 21l5-4h5l5 3h5c3 0 3 3 1 4l-9 5-7-2H3zm1-2H0v11h4z" fill="currentColor" /></svg></span><strong>Soutenir</strong><small>par un don</small></li>
    </ul>
  </aside>

</div>
  <div class="hero-note" aria-hidden="true"><span>Ils comptent<br />sur nous !</span><svg viewBox="0 0 420 160"><path d="M31 39C6 15 20 1 29 21 44-3 59 14 31 39c64 62 148 110 298 71" /><path d="m314 106 15 4-11 10" /></svg></div>
  <div class="language">
    <ion-icon [icon]="icons.globeOutline" aria-hidden="true" />
    <select aria-label="Langue"><option value="fr">FR</option></select>
    <ion-icon [icon]="icons.chevronDownOutline" aria-hidden="true" />
  </div>

<ion-icon class="paw-watermark" [icon]="icons.paw" aria-hidden="true" />
<div class="form-panel"><div class="panel-content"><ng-content /></div></div>
</main>
